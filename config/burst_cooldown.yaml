server:
  name: "Thinker"
  base_url: "http://24.124.32.70:38704/completion"
  model_alias: "thinker-model"

workload:
  users: 10
  duration_seconds: 1200
  mode: closed_loop
  max_in_flight: 64
  seed: 42

load_profile:
  type: composite
  segments:
    - kind: ramp
      duration_seconds: 120
      start_users: 5
      end_users: 40
    - kind: burst
      duration_seconds: 720
      base_users: 40
      peak_users: 90
      every_seconds: 120
      burst_duration_seconds: 20
    - kind: cooldown
      duration_seconds: 360
      start_users: 40
      end_users: 8

think_time:
  enabled: true
  distribution: uniform
  min_seconds: 0.2
  max_seconds: 2.5

prompts:
  min_tokens: 256
  max_tokens: 2048
  prefix: "Burst test: "

client:
  timeout_seconds: 240
  connect_timeout: 30
  retries: 2
  backoff_factor: 2.0

system:
  enabled: true
  source: ssh
  ssh_host: "24.124.32.70"
  ssh_user: "ubuntu"
  ssh_port: 22
  interval_seconds: 10

prometheus:
  enabled: false
