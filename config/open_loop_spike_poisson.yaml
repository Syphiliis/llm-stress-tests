server:
  name: "Flash"
  base_url: "http://24.124.32.70:38703/completion"
  model_alias: "flash-model"

workload:
  users: 8
  duration_seconds: 900
  mode: open_loop
  arrival_distribution: poisson
  max_in_flight: 128
  seed: 42

load_profile:
  type: spike
  base_rps: 2
  peak_rps: 20
  start_at_seconds: 300
  hold_seconds: 45

prompts:
  min_tokens: 128
  max_tokens: 1024
  prefix: "Load spike: "
  strategy: linear
  ramp:
    start_tokens: 128
    end_tokens: 1024
    duration_seconds: 900

client:
  timeout_seconds: 120
  connect_timeout: 15
  retries: 1
  backoff_factor: 2.0

ping:
  enabled: true
  interval_seconds: 60
  count: 4

system:
  enabled: true
  source: ssh
  ssh_host: "24.124.32.70"
  ssh_user: "ubuntu"
  ssh_port: 22
  interval_seconds: 5

prometheus:
  enabled: false
